<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<title>Agenda Maribone</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f4f4;
    padding:30px;
}

h1{
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}

th,td{
    border:1px solid #dcdcdc;
    padding:8px;
    text-align:center;
    vertical-align:top;
}

th{
    background:#2c3e50;
    color:#fff;
}

td{
    height:60px;
}

tbody tr:hover{
    background:#f7f9fc;
}

.semana{
    width:55px;
    font-weight:bold;
    background:#fafafa;
}

.mes{

    writing-mode:vertical-rl;
    transform:rotate(180deg);

    font-weight:bold;
    letter-spacing:2px;

    background:#34495e;
    color:white;

    width:45px;

}

</style>

</head>
<body>

<h1>Agenda Maribone 2026</h1>

<table>

<thead>

<tr>

<th></th>
<th>Sem</th>
<th>Seg</th>
<th>Ter</th>
<th>Qua</th>
<th>Qui</th>
<th>Sex</th>
<th>Sáb</th>
<th>Dom</th>

</tr>

</thead>

<tbody id="agenda"></tbody>

</table>

<script>

const meses=[

["JANEIRO",4],
["FEVEREIRO",4],
["MARÇO",5],
["ABRIL",4],
["MAIO",4],
["JUNHO",5],
["JULHO",4],
["AGOSTO",4],
["SETEMBRO",5],
["OUTUBRO",4],
["NOVEMBRO",4],
["DEZEMBRO",5]

];

let semana=1;

const agenda=document.getElementById("agenda");

meses.forEach(m=>{

    const nome=m[0];
    const quantidade=m[1];

    for(let i=0;i<quantidade;i++){

        let html="<tr>";

        if(i==0){

            html+=`
            <td class="mes" rowspan="${quantidade}">
                ${nome}
            </td>
            `;

        }

        html+=`
            <td class="semana">${String(semana).padStart(2,"0")}</td>

            <td contenteditable></td>
            <td contenteditable></td>
            <td contenteditable></td>
            <td contenteditable></td>
            <td contenteditable></td>
            <td contenteditable></td>
            <td contenteditable></td>

        </tr>
        `;

        agenda.innerHTML+=html;

        semana++;

    }

});

</script>

</body>
</html>
