<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<title>Agenda Maribone</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f4f4;
    padding:30px;
}

h1{
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}

th,td{
    border:1px solid #dcdcdc;
    padding:8px;
    text-align:center;
    vertical-align:top;
}

th{
    background:#2c3e50;
    color:#fff;
}

td{
    height:60px;
}

tbody tr:hover{
    background:#f7f9fc;
}

.semana{
    width:55px;
    font-weight:bold;
    background:#fafafa;
}

.mes{

    writing-mode:vertical-rl;
    transform:rotate(180deg);

    font-weight:bold;
    letter-spacing:2px;

    background:#34495e;
    color:white;

    width:45px;

}

</style>

</head>
<body>

<h1>Agenda Maribone 2026</h1>

<table>

<thead>

<tr>

<th></th>
<th>Sem</th>
<th>Seg</th>
<th>Ter</th>
<th>Qua</th>
<th>Qui</th>
<th>Sex</th>
<th>Sáb</th>
<th>Dom</th>

</tr>

</thead>

<tbody id="agenda"></tbody>

</table>

<script>

const agenda = document.getElementById("agenda");

const dataInicial = new Date(2025, 11, 29); // 29/12/2025

let semanas = [];

for(let i = 0; i < 52; i++){

    let inicioSemana = new Date(dataInicial);

    inicioSemana.setDate(dataInicial.getDate() + (i * 7));

    let dias = [];

    for(let d = 0; d < 7; d++){

        let dia = new Date(inicioSemana);

        dia.setDate(inicioSemana.getDate() + d);

        dias.push(dia);

    }

    semanas.push({
        numero:i+1,
        dias:dias,
        mes:dias[0].toLocaleString("pt-BR",{month:"long"}).toUpperCase()
    });

}


// agrupa semanas pelo mês

let grupos = {};

semanas.forEach(s=>{

    if(!grupos[s.mes]){
        grupos[s.mes] = [];
    }

    grupos[s.mes].push(s);

});


// cria tabela

Object.keys(grupos).forEach(mes=>{

    let lista = grupos[mes];


    lista.forEach((s,index)=>{

        let linha = "<tr>";


        if(index === 0){

            linha += `
            <td class="mes" rowspan="${lista.length}">
                ${mes}
            </td>
            `;

        }


        linha += `
        <td class="semana">
            ${String(s.numero).padStart(2,"0")}
        </td>
        `;


        s.dias.forEach(dia=>{

            let data = 
            String(dia.getDate()).padStart(2,"0") 
            + "/" +
            String(dia.getMonth()+1).padStart(2,"0");


            linha += `
            <td contenteditable="true">
                ${data}
            </td>
            `;

        });


        linha += "</tr>";


        agenda.innerHTML += linha;


    });


});


</script>

</body>
</html>
