<title>Agenda Maribone 2026</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f4f4f4;
    padding: 30px;
}

header {
    background-size: 30%;
    background-repeat: no-repeat;
    margin: 1px;
    border: 1px solid #a7a7a7;
    border-bottom: 1px solid #ffffff;
    max-width: 100%;
}

h1 {
    margin-bottom: 20px;
}

/* Área própria de rolagem horizontal */
.tabela-container {
    width: 100%;
    overflow-x: auto;
    position: relative;
    isolation: isolate;
}

/* Tabela */
table {
    width: 100%;
    min-width: 1050px;
    border-collapse: separate;
    border-spacing: 0;
    background: #ffffff;
}

/* Grade mais grossa */
th, td {
    border-right: 2px solid #000000;
    border-bottom: 2px solid #000000;
    text-align: center;
}

/* Primeira linha e primeira coluna da grade */
thead th {
    border-top: 2px solid #000000;
}

th:first-child,
td:first-child {
    border-left: 2px solid #000000;
}

th {
    background: #2c3e50;
    color: #ffffff;
    padding: 10px;
    position: relative;
    z-index: 2;
}

/* Cabeçalho DOM */
thead th:last-child {
    background: #8b0000;
}

/* Coluna dos meses */
.mes {
    width: 45px;
    min-width: 45px;
    background: #ffffff;
    color: #000000;
    font-weight: bold;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    text-align: center;
    vertical-align: middle;
}

/* Coluna Sem */
.semana {
    width: 55px;
    min-width: 55px;
    font-weight: bold;
    background: #eeeeee;
    position: sticky;
    left: 0;
    z-index: 4;
    background-clip: padding-box;
}

/* Canto do cabeçalho: fica acima da coluna fixa */
thead th:nth-child(2) {
    position: sticky;
    left: 0;
    z-index: 6;
    background: #2c3e50;
}

/* Domingo: fundo rosado */
#agenda td:nth-child(9) {
    background-color: #fff0f0;
}

/* Fechamento dos meses */
.fechamento-mes {
    border-bottom: 3px solid #dcdcdc;
}

.fim-mes td {
    border-bottom: 3px solid red;
}

/* Células dos dias */
.dia {
    position: relative;
    height: 90px;
    min-width: 120px;
    padding: 8px;
    vertical-align: top;
}

/* Anotações */
.anotacao {
    width: 100%;
    height: 70px;
    outline: none;
    text-align: left;
}

/* Data no rodapé da célula */
.data {
    position: absolute;
    bottom: 4px;
    left: 0;
    right: 0;
    font-size: 11px;
    color: #777777;
    text-align: center;
}

/* Dia atual */
.hoje {
    background: #fff3cd !important;
    border: 3px solid #ff9800 !important;
}

.hoje .data {
    font-weight: bold;
    color: #e65100;
}

.marcador-hoje {
    font-size: 10px;
    font-weight: bold;
    color: #e65100;
    display: block;
}

/* Ajustes para telas menores */
@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    header {
        gap: 10px !important;
    }

    header img {
        width: 120px !important;
    }

    header h1 {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<header style="display:flex; align-items:center; gap:30px; position:sticky; top:0; z-index:1000; background:#f4f4f4;">

    <a href="https://maribone.github.io/maribone">
        <img
            src="https://lh7-us.googleusercontent.com/QXf3JP0Hqkn2WY2_aoz-PWQtenCJtb2gXCRS7D1nI3U5VhQmeKjm5_znfd0WeyuMNvHCZFFWgroFfCyEc0Oam7jBk17vrdmHu3Ee1ztuwHH9C7hVCHwvKGSreh7-ZZ6e4hsocPLMhwbtU3osLph3FcawbpnYFA"
            alt="Maribone Tecnologia"
            style="width:30em; max-width:100%; height:auto; padding-top:1%;">
    </a>

    <h1 style="margin:0;">Agenda Maribone 2026</h1>
</header>

<div class="tabela-container">
    <table>
        <thead>
            <tr>
                <th></th>
                <th>Sem</th>
                <th>Seg</th>
                <th>Ter</th>
                <th>Qua</th>
                <th>Qui</th>
                <th>Sex</th>
                <th>Sáb</th>
                <th>Dom</th>
            </tr>
        </thead>
        <tbody id="agenda"></tbody>
    </table>
</div>

<script>
const agenda = document.getElementById("agenda");

// Semana 01 começa em 29/12/2025
const inicio = new Date(2025, 11, 29);
const semanas = [];

for (let i = 0; i < 52; i++) {
    const dias = [];

    for (let d = 0; d < 7; d++) {
        const data = new Date(inicio);
        data.setDate(inicio.getDate() + (i * 7) + d);
        dias.push(data);
    }

    semanas.push({
        numero: i + 1,
        dias
    });
}

// Agrupa semanas pelo mês predominante em 2026
const grupos = {};

semanas.forEach(s => {
    const dias2026 = s.dias.filter(
        d => d.getFullYear() === 2026
    );

    if (dias2026.length === 0) return;

    const contagem = {};

    dias2026.forEach(d => {
        const nomeMes = d.toLocaleString(
            "pt-BR",
            { month: "long" }
        ).toUpperCase();

        contagem[nomeMes] = (contagem[nomeMes] || 0) + 1;
    });

    const mes = Object.keys(contagem).reduce((a, b) =>
        contagem[a] > contagem[b] ? a : b
    );

    if (!grupos[mes]) grupos[mes] = [];
    grupos[mes].push(s);
});

// Monta a tabela
Object.keys(grupos).forEach(mes => {
    const lista = grupos[mes];

    lista.forEach((sem, index) => {
        const ultimaSemana = index === lista.length - 1;

        let linha = ultimaSemana
            ? '<tr class="fim-mes">'
            : '<tr>';

        linha += `
            <td class="mes ${ultimaSemana ? "fechamento-mes" : ""}">
                ${index === Math.floor(lista.length / 2) ? mes : ""}
            </td>
            <td class="semana">
                ${String(sem.numero).padStart(2, "0")}
            </td>
        `;

        sem.dias.forEach(d => {
            const data =
                String(d.getDate()).padStart(2, "0") +
                "/" +
                String(d.getMonth() + 1).padStart(2, "0");

            const hoje = new Date();

            const ehHoje =
                d.getDate() === hoje.getDate() &&
                d.getMonth() === hoje.getMonth() &&
                d.getFullYear() === hoje.getFullYear();

            const classeHoje = ehHoje ? "hoje" : "";

            const dataISO =
                d.getFullYear() + "-" +
                String(d.getMonth() + 1).padStart(2, "0") + "-" +
                String(d.getDate()).padStart(2, "0");

            linha += `
                <td
                    class="dia ${classeHoje}"
                    ${ehHoje ? 'id="hoje"' : ""}
                    data-data="${dataISO}">
                    <div class="anotacao" contenteditable="true"></div>
                    <span class="data">${data}</span>
                </td>
            `;
        });

        linha += "</tr>";
        agenda.insertAdjacentHTML("beforeend", linha);
    });
});

// Carrega anotações e salva alterações
document.querySelectorAll(".anotacao").forEach(anotacao => {
    const dia = anotacao.closest(".dia");
    const data = dia.dataset.data;
    const chave = "agenda_maribone_" + data;
    const salvo = localStorage.getItem(chave);

    if (salvo !== null) {
        anotacao.innerHTML = salvo;
    }

    anotacao.addEventListener("input", () => {
        localStorage.setItem(chave, anotacao.innerHTML);
    });
});

// Leva automaticamente para o dia atual
const elementoHoje = document.getElementById("hoje");

if (elementoHoje) {
    elementoHoje.scrollIntoView({
        behavior: "smooth",
        block: "center",
        inline: "nearest"
    });
}
</script>

<script src="https://www.maribone.com.br/telemetria.js"></script>

</body>
</html>
