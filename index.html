<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<title>Agenda Maribone 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
    padding:30px;
}

h1{
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th, td{
    border:1px solid #ccc;
    text-align:center;
}

th{
    background:#2c3e50;
    color:white;
    padding:10px;
}

.mes{

    writing-mode:vertical-rl;
    transform:rotate(180deg);

    background:#34495e;
    color:white;

    font-weight:bold;
    letter-spacing:2px;

    width:45px;

}

.mes.vazio{

    background:white;
    border-right:1px solid #ccc;

}

.semana{

    width:55px;
    font-weight:bold;
    background:#eee;

}


.dia{

    position:relative;

    height:90px;
    min-width:120px;

    padding:8px;

    vertical-align:top;

}


.anotacao{

    width:100%;
    height:70px;

    outline:none;

}


.data{

    position:absolute;

    bottom:4px;
    left:0;
    right:0;

    font-size:11px;

    color:#777;

    text-align:center;

}

.hoje{

    background:#fff3cd;

    border:3px solid #ff9800 !important;

}


.hoje .data{

    font-weight:bold;
    color:#e65100;

}


.marcador-hoje{

    font-size:10px;
    font-weight:bold;

    color:#e65100;

    display:block;

}
    
</style>

</head>

<body>


<h1>Agenda Maribone 2026</h1>


<table>

<thead>

<tr>

<th></th>
<th>Sem</th>
<th>Seg</th>
<th>Ter</th>
<th>Qua</th>
<th>Qui</th>
<th>Sex</th>
<th>Sáb</th>
<th>Dom</th>

</tr>

</thead>


<tbody id="agenda"></tbody>


</table>



<script>


const agenda = document.getElementById("agenda");


// Semana 01 começa em 29/12/2025
const inicio = new Date(2025,11,29);


let semanas=[];



for(let i=0;i<52;i++){


    let dias=[];


    for(let d=0;d<7;d++){

        let data=new Date(inicio);

        data.setDate(
            inicio.getDate() + (i*7) + d
        );


        dias.push(data);

    }



    semanas.push({

        numero:i+1,
        dias:dias

    });


}



// Agrupa pelo mês que pertence ao ano de 2026

let grupos={};



semanas.forEach(s=>{


    let diaAno=s.dias.find(d=>d.getFullYear()==2026);


    if(!diaAno){
        return;
    }



    let mes=diaAno.toLocaleString(
        "pt-BR",
        {month:"long"}
    ).toUpperCase();



    if(!grupos[mes]){
        grupos[mes]=[];
    }


    grupos[mes].push(s);


});




// Monta tabela


Object.keys(grupos).forEach(mes=>{


    let lista=grupos[mes];



    lista.forEach((sem,index)=>{


        let linha="<tr>";



        if(index===0){

    linha+=`

    <td class="mes">
        ${mes}
    </td>

    `;

}else{

    linha+=`

    <td class="mes vazio"></td>

    `;

}

        linha+=`

        <td class="semana">
            ${String(sem.numero).padStart(2,"0")}
        </td>

        `;



        sem.dias.forEach(d=>{


    let data=

    String(d.getDate()).padStart(2,"0")
    +"/"+
    String(d.getMonth()+1).padStart(2,"0");


    let hoje = new Date();


    let classeHoje="";


    let marcador="";


    if(
        d.getDate()===hoje.getDate() &&
        d.getMonth()===hoje.getMonth() &&
        d.getFullYear()===hoje.getFullYear()
    ){

        classeHoje="hoje";

        marcador=`
        <span class="marcador-hoje">
        
        </span>
        `;

    }



    linha+=`

   <td id="${classeHoje}" class="dia ${classeHoje}">

        <div 
        class="anotacao"
        contenteditable="true">
        </div>


        ${marcador}


        <span class="data">
            ${data}
        </span>


    </td>

    `;


});



        linha+="</tr>";

        agenda.innerHTML+=linha;


    });


});

// Leva automaticamente para o dia atual

const hoje = document.getElementById("hoje");

if(hoje){

    hoje.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

}

</script>


</body>
</html>
