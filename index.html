@keyframes piscar {

<body>
<header style="display:flex; align-items:center; gap:30px; position:sticky; top:0; z-index:1000; background:#ffffff; padding: 10px;">
    <a href="https://maribone.github.io/maribone">
        <img src="https://lh7-us.googleusercontent.com/QXf3JP0Hqkn2WY2_aoz-PWQtenCJtb2gXCRS7D1nI3U5VhQmeKjm5_znfd0WeyuMNvHCZFFWgroFfCyEc0Oam7jBk17vrdmHu3Ee1ztuwHH9C7hVCHwvKGSreh7-ZZ6e4hsocPLMhwbtU3osLph3FcawbpnYFA"
             style="width:25em; max-width:100%; height:auto; padding-top:1%;">
    </a>
    <h1 style="margin:0;">✓Agenda Maribone 2026</h1>
</header>
    
<table>
<thead>
<tr>
<th></th>
<th>Sem</th>
<th>SEG</th>
<th>TER</th>
<th>QUA</th>
<th>QUI</th>
<th>SEX</th>
<th>SAB</th>
<th>DOM</th>
</tr>
</thead>
<tbody id="agenda"></tbody>
</table>

<script>
const agenda = document.getElementById("agenda");

// Semana 01 começa em 29/12/2025
const inicio = new Date(2025, 11, 29);
let semanas = [];

for(let i = 0; i < 52; i++){
    let dias = [];
    for(let d = 0; d < 7; d++){
        let data = new Date(inicio);
        data.setDate(inicio.getDate() + (i * 7) + d);
        dias.push(data);
    }
    semanas.push({
        numero: i + 1,
        dias: dias
    });
}

// Agrupa pelo mês que pertence ao ano de 2026
let grupos = {};

semanas.forEach(s => {
    let dias2026 = s.dias.filter(d => d.getFullYear() == 2026);
    if(dias2026.length === 0){
        return;
    }

    let contagem = {};
    dias2026.forEach(d => {
        let nomeMes = d.toLocaleString("pt-BR", { month: "long" }).toUpperCase();
        contagem[nomeMes] = (contagem[nomeMes] || 0) + 1;
    });

    let mes = Object.keys(contagem).reduce((a, b) =>
        contagem[a] > contagem[b] ? a : b
    );

    if(!grupos[mes]){
        grupos[mes] = [];
    }
    grupos[mes].push(s);
});
    
// Monta tabela com rowspan dinâmico
Object.keys(grupos).forEach(mes => {
    let lista = grupos[mes];
    let totalSemanasMes = lista.length;

    lista.forEach((sem, index) => {
        let ultimaSemana = (index === lista.length - 1);
        let linha = ultimaSemana ? '<tr class="fim-mes">' : '<tr>';

        if (index === 0) {
            linha += `
            <td class="mes ${ultimaSemana ? "fechamento-mes" : ""}" rowspan="${totalSemanasMes}">
                ${mes}
            </td>
            `;
        }

        // Descobre se esta semana contém o dia de hoje para piscar
        let hojeRef = new Date();
        let contemHoje = sem.dias.some(d => 
            d.getDate() === hojeRef.getDate() &&
            d.getMonth() === hojeRef.getMonth() &&
            d.getFullYear() === hojeRef.getFullYear()
        );
        let classeSemanaAtual = contemHoje ? "semana-atual" : "";

        linha += `
        <td class="semana ${classeSemanaAtual}">
            ${String(sem.numero).padStart(2, "0")}
        </td>
        `;

        sem.dias.forEach(d => {
            let data = String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0");
            let classeHoje = "";
            let marcador = "";

            if(
                d.getDate() === hojeRef.getDate() &&
                d.getMonth() === hojeRef.getMonth() &&
                d.getFullYear() === hojeRef.getFullYear()
            ){
                classeHoje = "hoje";
                marcador = `<span class="marcador-hoje"></span>`;
            }

            let idAtributo = (classeHoje === "hoje") ? 'id="hoje"' : '';

            let classeDomingo = "";
            if (d.getDay() === 0) {
                classeDomingo = "domingo-celula";
            }

            linha += `
            <td ${idAtributo} class="dia ${classeHoje} ${classeDomingo}" data-data="${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}">
                <div class="anotacao" contenteditable="true"></div>
                ${marcador}
                <span class="data">${data}</span>
            </td>
            `;
        });

        linha += "</tr>";
        agenda.innerHTML += linha;
    });
});

// Leva automaticamente para o dia atual após o carregamento completo
setTimeout(() => {
    const hojeElement = document.getElementById("hoje");
    if(hojeElement){
        hojeElement.scrollIntoView({
            behavior: "smooth",
            block: "center",
            inline: "center"
        });
    }
}, 100);

// ========================================
// LOCALSTORAGE DA AGENDA
// ========================================
const anotacoes = document.querySelectorAll(".anotacao");

anotacoes.forEach(anotacao => {
    const dia = anotacao.closest(".dia");
    const data = dia.dataset.data;
    const salvo = localStorage.getItem("agenda_maribone_" + data);

    if (salvo !== null) {
        anotacao.innerHTML = salvo;
    }
});

anotacoes.forEach(anotacao => {
    anotacao.addEventListener("input", function(){
        const dia = anotacao.closest(".dia");
        const data = dia.dataset.data;
        localStorage.setItem(
            "agenda_maribone_" + data,
            anotacao.innerHTML
        );
    });
});
</script>

<script src="https://www.maribone.com.br/telemetria.js"></script>
</body>
